<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reel Ads</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 16px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 26px;
            margin: 0 0 10px 0;
            color: #38bdf8;
            letter-spacing: 1px;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            background-color: #334155;
            color: #94a3b8;
        }
        .status-badge.success {
            background-color: #064e3b;
            color: #34d399;
        }
        .status-badge.warning {
            background-color: #78350f;
            color: #fbbf24;
        }
        .user-box {
            background-color: #0f172a;
            border-radius: 10px;
            padding: 12px;
            margin-top: 12px;
            font-size: 14px;
            text-align: left;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Reel Ads</h1>
        <div id="badge" class="status-badge">Tekshirilmoqda...</div>
        <div id="content" class="user-box">Yuklanmoqda...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const badgeEl = document.getElementById('badge');
        const contentEl = document.getElementById('content');

        async function authenticate() {
            const initData = tg.initData;

            // Agar oddiy brauzerda ochilgan bo'lsa (Telegram ichida emas)
            if (!initData) {
                badgeEl.className = 'status-badge warning';
                badgeEl.innerText = 'Oddiy brauzer';
                contentEl.innerHTML = 'Ilova faqat Telegram orqali ochilganda xavfsiz autentifikatsiyadan o\'tadi.';
                return;
            }

            // Telegram ichida ochilgan bo'lsa, backendga tekshiruvga yuboramiz
            try {
                const response = await fetch('/api/auth/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ init_data: initData })
                });

                const data = await response.json();

                if (response.ok && data.authenticated) {
                    badgeEl.className = 'status-badge success';
                    badgeEl.innerText = 'Xavfsiz ulandi';
                    contentEl.innerHTML = `
                        <b>Foydalanuvchi:</b> ${data.user.first_name || ''} ${data.user.last_name || ''}<br>
                        <b>ID:</b> ${data.user.id}<br>
                        <b>Username:</b> @${data.user.username || 'mavjud emas'}
                    `;
                } else {
                    badgeEl.className = 'status-badge warning';
                    badgeEl.innerText = 'Xatolik';
                    contentEl.innerText = data.detail || 'Autentifikatsiya rad etildi.';
                }
            } catch (err) {
                badgeEl.className = 'status-badge warning';
                badgeEl.innerText = 'Aloqa xatosi';
                contentEl.innerText = 'Serverga ulanib bo\'lmadi.';
            }
        }

        authenticate();
    </script>
</body>
</html>
