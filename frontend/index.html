<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reel Ads Mini App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 16px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
        }
        .btn-ad {
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 16px;
            transition: opacity 0.2s;
        }
        .btn-ad:active {
            opacity: 0.8;
        }
        #status-msg {
            margin-top: 12px;
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>REEL ADS</h1>
        <p id="user-info">Yuklanmoqda...</p>

        <button class="btn-ad" id="show-ad-btn">🎬 Reklama ko‘rish (Reward)</button>
        <p id="status-msg"></p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const userInfoEl = document.getElementById('user-info');
        const statusMsg = document.getElementById('status-msg');
        const showAdBtn = document.getElementById('show-ad-btn');

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userInfoEl.innerText = "Foydalanuvchi: " + tg.initDataUnsafe.user.first_name;
        } else {
            userInfoEl.innerText = "Brauzer rejimi (Telegramdan kiring)";
        }

        // Adsgram Reward kontrollerini ulash
        const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "int-48138" }) : null;

        showAdBtn.addEventListener('click', () => {
            if (!AdController) {
                statusMsg.style.color = "#ef4444";
                statusMsg.innerText = "Adsgram SDK yuklanmadi yoki brauzerda ochilgan.";
                return;
            }

            statusMsg.style.color = "#38bdf8";
            statusMsg.innerText = "Reklama tayyorlanmoqda...";

            AdController.show().then((result) => {
                // Foydalanuvchi videoni to'liq ko'rsa
                statusMsg.style.color = "#22c55e";
                statusMsg.innerText = "Muvaffaqiyatli ko‘rildi! Mukofot berildi.";
            }).catch((result) => {
                // Xatolik yoki oxirigacha ko'rmasdan yopish
                statusMsg.style.color = "#ef4444";
                statusMsg.innerText = "Reklama to‘liq ko‘rilmadi yoki xatolik yuz berdi.";
            });
        });
    </script>
</body>
</html>
