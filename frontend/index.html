<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Reel Ads</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0d141e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background: #18222d;
            width: 100%;
            max-width: 360px;
            border-radius: 20px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            color: #2ea5ff;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .badge {
            background-color: rgba(0, 194, 130, 0.15);
            color: #00c282;
            font-size: 13px;
            font-weight: 600;
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 194, 130, 0.3);
        }

        .user-box {
            background: #111923;
            width: 100%;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 24px;
            font-size: 14px;
            line-height: 1.6;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .user-box span {
            color: #8393a3;
        }

        .user-box strong {
            color: #ffffff;
            font-weight: 500;
        }

        .btn-watch {
            background: linear-gradient(135deg, #0088cc, #006699);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
            transition: all 0.2s ease;
        }

        .btn-watch:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-watch:disabled {
            background: #2b394a;
            color: #637587;
            cursor: not-allowed;
            box-shadow: none;
        }

        .status-msg {
            margin-top: 14px;
            font-size: 13px;
            text-align: center;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="title">Reel Ads</div>
        <div class="badge">Xavfsiz ulandi</div>

        <div class="user-box">
            <div><span>Foydalanuvchi: </span><strong id="userName">Yuklanmoqda...</strong></div>
            <div><span>ID: </span><strong id="userId">Yuklanmoqda...</strong></div>
            <div><span>Username: </span><strong id="userTag">...</strong></div>
        </div>

        <button id="showAdBtn" class="btn-watch">
            <span>🎬</span> Reklama ko‘rish (Reward)
        </button>

        <div id="statusMsg" class="status-msg"></div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const user = tg?.initDataUnsafe?.user;
        const userIdElem = document.getElementById("userId");
        const userNameElem = document.getElementById("userName");
        const userTagElem = document.getElementById("userTag");
        const statusMsg = document.getElementById("statusMsg");

        let currentUserId = null;

        if (user) {
            currentUserId = user.id;
            userNameElem.textContent = `${user.first_name || ""} ${user.last_name || ""}`.trim() || "Foydalanuvchi";
            userIdElem.textContent = user.id;
            userTagElem.textContent = user.username ? `@${user.username}` : "Mavjud emas";
        } else {
            userNameElem.textContent = "Mehmon";
            userIdElem.textContent = "Aniqlanmadi";
            userTagElem.textContent = "—";
        }

        // debug: "true" qilib belgilandi
        const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "41222", debug: "true" }) : null;
        const showBtn = document.getElementById("showAdBtn");

        showBtn.addEventListener("click", () => {
            if (!AdController) {
                statusMsg.style.color = "#ff4d4d";
                statusMsg.textContent = "Reklama tizimi yuklanmadi.";
                return;
            }

            showBtn.disabled = true;
            statusMsg.style.color = "#8393a3";
            statusMsg.textContent = "Reklama ochilmoqda...";

            AdController.show().then((result) => {
                showBtn.disabled = false;
                statusMsg.style.color = "#00c282";
                statusMsg.textContent = "✅ Reklama ko'rildi! Mukofot hisoblandi.";
                if (tg?.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred("success");
                }
            }).catch((result) => {
                showBtn.disabled = false;
                statusMsg.style.color = "#ff9900";
                statusMsg.textContent = "⚠️ Reklama to'liq ko'rilmadi yoki yopildi.";
                if (tg?.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred("warning");
                }
            });
        });
    </script>
</body>
</html>
